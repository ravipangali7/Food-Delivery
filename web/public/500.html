<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#E31E24" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <title>Something went wrong · Shyam's Sweets</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #fafafa;
      color: #18181b;
    }
    .card {
      max-width: 28rem;
      width: 100%;
      text-align: center;
      background: #fff;
      border-radius: 1rem;
      padding: 2.5rem 2rem;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
    }
    .code { font-size: 3.5rem; font-weight: 700; color: #E31E24; margin: 0 0 0.5rem; line-height: 1; }
    h1 { font-size: 1.25rem; margin: 0 0 0.75rem; font-weight: 600; }
    p { margin: 0 0 1.5rem; color: #71717a; line-height: 1.5; }
    a {
      display: inline-block;
      padding: 0.65rem 1.25rem;
      border-radius: 0.5rem;
      background: #E31E24;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
    }
    a:hover { background: #c4191f; }
  </style>
</head>
<body>
  <div class="card">
    <p class="code">500</p>
    <h1>Something went wrong</h1>
    <p>We are having trouble completing your request. Please try again in a few moments.</p>
    <a href="/">Return home</a>
  </div>
</body>
</html>
